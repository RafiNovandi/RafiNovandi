name: Update GitHub Stats SVG

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  update-svg:
    runs-on: ubuntu-latest
    # Skip runs triggered by the bot's own auto-commit to prevent infinite loops
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !contains(github.event.head_commit.message, 'Auto-update GitHub Streak SVG')
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Updater Script
        run: node update-stats.js

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update GitHub Streak SVG"
          file_pattern: assets/github-streak.svg