<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 215" width="850px" height="215px" direction="ltr">
    <style>
        .title { font-family: "Segoe UI", Ubuntu, sans-serif; font-weight: 700; font-size: 18px; fill: #FFFFFF; }
        .big-num { font-family: "Segoe UI", Ubuntu, sans-serif; font-weight: 700; font-size: 28px; fill: #FFFFFF; }
        .label { font-family: "Segoe UI", Ubuntu, sans-serif; font-weight: 700; font-size: 14px; }
        .label-streak { font-family: "Segoe UI", Ubuntu, sans-serif; font-weight: 700; font-size: 14px; fill: #FF9900; }
        .date { font-family: "Segoe UI", Ubuntu, sans-serif; font-weight: 400; font-size: 12px; fill: #8B949E; }
        .lang-text { font-family: "Segoe UI", Ubuntu, sans-serif; font-weight: 400; font-size: 13px; fill: #8B949E; }
        
        @keyframes fadein {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
        .animated { opacity: 0; animation: fadein 0.8s linear forwards; }
    </style>

    <!-- TAMBAHAN MASKING UNTUK MEMOTONG GARIS BULAT -->
    <defs>
        <mask id="mask_out_ring_behind_fire">
            <rect width="850" height="215" fill="white"/>
            <!-- Elips hitam ini ukurannya pas sebesar icon api untuk menutupi garis -->
            <ellipse cx="240" cy="32" rx="14" ry="18" fill="black"/>
        </mask>
    </defs>

    <!-- <rect width="850" height="215" rx="8" fill="#0D1117" /> -->

    <!-- ========================================== -->
    <!-- KIRI: STREAK STATS                         -->
    <!-- ========================================== -->
    <g transform="translate(10, 10)" class="animated">
        <!-- Border Kotak Kiri -->
        <rect stroke="#ffffff" fill="transparent" rx="4.5" x="0.5" y="0.5" width="480" height="194"/>
        
        <!-- Garis Pemisah Vertikal -->
        <line x1="160" y1="28" x2="160" y2="170" stroke="#8b8b8b" stroke-width="1"/>
        <line x1="320" y1="28" x2="320" y2="170" stroke="#8b8b8b" stroke-width="1"/>

        <!-- Total Contributions -->
        <g transform="translate(80, 48)">
            <text x="0" y="32" text-anchor="middle" class="big-num">{{TOTAL}}</text>
        </g>
        <g transform="translate(80, 84)">
            <text x="0" y="32" text-anchor="middle" fill="#FFFFFF" class="label">Total Contributions</text>
        </g>
        <g transform="translate(80, 114)">
            <text x="0" y="32" text-anchor="middle" class="date">{{TOTAL_DATE}}</text>
        </g>

        <!-- Current Streak -->
        <!-- Ring dengan efek MASK -->
        <g mask="url(#mask_out_ring_behind_fire)">
            <circle cx="240" cy="71" r="40" fill="none" stroke="#FF9900" stroke-width="5"></circle>
        </g>
        
        <!-- Fire Icon -->
        <g transform="translate(240, 19.5)">
            <path d="M 1.5 0.67 C 1.5 0.67 2.24 3.32 2.24 5.47 C 2.24 7.53 0.89 9.2 -1.17 9.2 C -3.23 9.2 -4.79 7.53 -4.79 5.47 L -4.76 5.11 C -6.78 7.51 -8 10.62 -8 13.99 C -8 18.41 -4.42 22 0 22 C 4.42 22 8 18.41 8 13.99 C 8 8.6 5.41 3.79 1.5 0.67 Z M -0.29 19 C -2.07 19 -3.51 17.6 -3.51 15.86 C -3.51 14.24 -2.46 13.1 -0.7 12.74 C 1.07 12.38 2.9 11.53 3.92 10.16 C 4.31 11.45 4.51 12.81 4.51 14.2 C 4.51 16.85 2.36 19 -0.29 19 Z" fill="#FF9900"/>
        </g>
        
        <g transform="translate(240, 48)">
            <text x="0" y="32" text-anchor="middle" class="big-num">{{CURRENT}}</text>
        </g>
        <g transform="translate(240, 108)">
            <text x="0" y="32" text-anchor="middle" class="label-streak">Current Streak</text>
        </g>
        <g transform="translate(240, 145)">
            <text x="0" y="21" text-anchor="middle" class="date">{{CURRENT_DATE}}</text>
        </g>

        <!-- Longest Streak -->
        <g transform="translate(400, 48)">
            <text x="0" y="32" text-anchor="middle" class="big-num">{{LONGEST}}</text>
        </g>
        <g transform="translate(400, 84)">
            <text x="0" y="32" text-anchor="middle" fill="#FFFFFF" class="label">Longest Streak</text>
        </g>
        <g transform="translate(400, 114)">
            <text x="0" y="32" text-anchor="middle" class="date">{{LONGEST_DATE}}</text>
        </g>
    </g>

    <!-- ========================================== -->
    <!-- KANAN: TOP LANGUAGES                       -->
    <!-- ========================================== -->
    <g transform="translate(500, 10)" class="animated">
        <!-- Border Kotak Kanan -->
        <rect stroke="#ffffff" fill="transparent" rx="4.5" x="0.5" y="0.5" width="340" height="194"/>
        
        <!-- Judul -->
        <text x="25" y="40" class="title">Most Used Languages</text>

        <!-- Progress Bar Dinamis -->
        <clipPath id="bar-clip">
            <rect x="25" y="60" width="290" height="8" rx="4"/>
        </clipPath>
        <g clip-path="url(#bar-clip)">
{{LANG_BARS}}
        </g>

        <!-- Legends Dinamis -->
{{LANG_LEGENDS}}
    </g>
</svg>
